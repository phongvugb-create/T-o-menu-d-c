
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Dropdown Dọc</title>

    <style>
        /* Định dạng chung */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Menu chính */
        #menu ul {
            list-style: none;
        }

        #menu > ul {
            width: 140px;
        }

        #menu li {
            position: relative;
            width: 140px;
            height: 35px;
            line-height: 35px;
            background-color: black;
            cursor: pointer;
        }

        /* Liên kết trong menu */
        #menu a {
            display: block;
            padding: 0 15px;
            color: white;
            text-decoration: none;
        }

        /* Đổi màu khi di chuột */
        #menu li:hover {
            background-color: #444;
        }

        #menu li:hover > a {
            background-color: #444;
        }

        /* Menu con: ẩn mặc định */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
            z-index: 10;
        }

        /* Hiển thị menu con khi rê chuột vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>
    <h1>Menu Dropdown Dọc</h1>

    <div id="menu">
        <ul>
            <li><a href="#home">Trang chủ</a></li>

            <li>
                <a href="#products">Sản phẩm ▸</a>
                <ul>
                    <li><a href="#phone">Điện thoại</a></li>
                    <li><a href="#laptop">Laptop</a></li>
                    <li><a href="#accessories">Phụ kiện</a></li>
                </ul>
            </li>

            <li>
                <a href="#services">Dịch vụ ▸</a>
                <ul>
                    <li><a href="#design">Thiết kế web</a></li>
                    <li><a href="#consulting">Tư vấn</a></li>
                </ul>
            </li>

            <li><a href="#about">Giới thiệu</a></li>
            <li><a href="#contact">Liên hệ</a></li>
        </ul>
    </div>
</body>
</html>
